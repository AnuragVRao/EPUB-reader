name: Deploy

# Builds the site and publishes dist/ to GitHub Pages. Requires Pages to be
# enabled for the repository with "GitHub Actions" as the source
# (Settings -> Pages -> Build and deployment).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish rather than cancel it
# halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same checks CI runs, so a broken commit is never published.
      - run: npm run lint
      - run: npm test
      # Vite's base is relative, so the build needs no knowledge of the
      # /<repository>/ path Pages serves it from.
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
