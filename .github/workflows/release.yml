name: Release

# Pushing a version tag (v1.2.3) publishes a GitHub Release for it: the
# matching section of CHANGELOG.md as the notes, and the built site as a zip.
# To release: update CHANGELOG.md and the version in package.json, commit,
# then `git tag -a v1.2.3 -m "..." && git push origin v1.2.3`.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json and the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi
          # The notes are this version's section of the changelog: from its
          # heading up to the next version heading.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      # The same checks as CI, so a broken commit is never released.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Package the built site
        run: (cd dist && zip -qr "../epub-reader-${GITHUB_REF_NAME}.zip" .)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "EPUB Reader ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            "epub-reader-${GITHUB_REF_NAME}.zip"
